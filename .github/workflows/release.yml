name: Release

# Si avvia con un tag di versione: git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  crea-release:
    runs-on: ubuntu-24.04
    outputs:
      release-id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@v4

      - name: Note di versione dal CHANGELOG
        run: node scripts/note-versione.mjs "${GITHUB_REF_NAME#v}" > note.md

      - name: Release in bozza
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --title "SP Gestionale $GITHUB_REF_NAME" --notes-file note.md
          echo "id=$(gh api "repos/$GITHUB_REPOSITORY/releases" -q ".[] | select(.tag_name == \"$GITHUB_REF_NAME\") | .id")" >> "$GITHUB_OUTPUT"

  compila:
    needs: crea-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            argomenti: ""
          # 22.04: la glibc più vecchia rende i pacchetti Linux compatibili con più distribuzioni
          - os: ubuntu-22.04
            argomenti: ""
          - os: macos-latest
            argomenti: "--target universal-apple-darwin"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Dipendenze di sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libxdo-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.crea-release.outputs.release-id }}
          args: ${{ matrix.argomenti }}

  pubblica:
    needs: [crea-release, compila]
    runs-on: ubuntu-24.04
    steps:
      # Solo una release pubblicata è "latest": è lì che l'app cerca latest.json
      - name: Pubblica la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
