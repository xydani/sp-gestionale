name: Release

# Si avvia con un tag di versione: git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  crea-release:
    runs-on: ubuntu-24.04
    outputs:
      release-id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@v5

      - name: Note di versione dal CHANGELOG
        run: node scripts/note-versione.mjs "${GITHUB_REF_NAME#v}" > note.md

      - name: Release in bozza
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        # L'API restituisce subito l'id della bozza, che serve a tauri-action per caricare i file
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="$GITHUB_REF_NAME" \
            -f name="SP Gestionale $GITHUB_REF_NAME" \
            -F draft=true \
            -F body=@note.md \
            -q .id)
          test -n "$id" || { echo "Id della release non ricevuto"; exit 1; }
          echo "id=$id" >> "$GITHUB_OUTPUT"

  compila:
    needs: crea-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            argomenti: ""
          # 22.04: la glibc più vecchia rende i pacchetti Linux compatibili con più distribuzioni
          - os: ubuntu-22.04
            argomenti: ""
          - os: macos-latest
            argomenti: "--target universal-apple-darwin"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Dipendenze di sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libxdo-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.crea-release.outputs.release-id }}
          args: ${{ matrix.argomenti }}

  pubblica:
    needs: [crea-release, compila]
    runs-on: ubuntu-24.04
    steps:
      - name: Verifica che i file siano stati caricati
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          file=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name')
          echo "$file"
          for atteso in latest.json -setup.exe .AppImage .deb .dmg; do
            echo "$file" | grep -q -- "$atteso" || { echo "Manca $atteso"; exit 1; }
          done

      # Solo una release pubblicata è "latest": è lì che l'app cerca latest.json
      - name: Pubblica la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
