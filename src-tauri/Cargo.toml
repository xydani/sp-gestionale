[package]
name = "sp-gestionale"
version = "0.1.0"
description = "Gestione abbonamenti palestra"
authors = ["xydani"]
license = "MIT"
edition = "2024"
default-run = "sp-gestionale"

[lib]
name = "sp_gestionale_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4.45", default-features = false, features = ["std", "serde", "clock"] }
thiserror = "2.0.21"
rusqlite = { version = "0.41.1", features = ["bundled-sqlcipher-vendored-openssl", "functions", "chrono"] }
zeroize = "1.9.1"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3.27.0"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
