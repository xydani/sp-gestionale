[package]
name = "sp-gestionale"
version = "0.1.0"
description = "Gestione abbonamenti palestra"
authors = ["xydani"]
license = "MIT"
edition = "2024"

[lib]
name = "sp_gestionale_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4.45", default-features = false, features = ["std", "serde", "clock"] }
thiserror = "2.0.21"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
